name: CI — Build & Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check Docker build
        run: docker compose build --no-cache

      - name: Run unit tests (no data needed)
        run: |
          python -m pytest tests/test_drift.py -v
          python -m pytest tests/test_rollback.py -v

      # Integration tests require data/ directory
      # These run only when data is available (e.g., self-hosted runner)
      - name: Run integration tests (if data available)
        if: hashFiles('data/') != ''
        run: |
          python -m pytest tests/ -v --tb=short
